name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      PROJECT_DIR: ios
      SCHEME: QGram
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 scripts/generate_xcodeproj.py

      - name: Build archive (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild -project QGram.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QGram.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP/QGram.xcarchive/Products/Applications"
          mkdir -p Payload
          mv QGram.app Payload/
          zip -r "$RUNNER_TEMP/QGram-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QGram-unsigned-ipa
          path: ${{ runner.temp }}/QGram-unsigned.ipa
          if-no-files-found: error
