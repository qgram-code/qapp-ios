name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:  # кнопка "Run workflow" в разделе Actions

jobs:
  build:
    runs-on: macos-14
    env:
      SCHEME: QGram
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # Проект собирается генератором из файлов — регенерируем на всякий случай
      - name: Generate Xcode project
        run: |
          PROJ_DIR="$(dirname "$(find . -name generate_xcodeproj.py | head -1)")"
          cd "$PROJ_DIR/.."
          python3 scripts/generate_xcodeproj.py

      - name: Locate project
        id: proj
        run: echo "dir=$(dirname "$(find . -name '*.xcodeproj' | head -1)")" >> "$GITHUB_OUTPUT"

      - name: Build archive (unsigned)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          xcodebuild -project QGram.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/QGram.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP/QGram.xcarchive/Products/Applications"
          mkdir -p Payload
          mv QGram.app Payload/
          zip -r "$RUNNER_TEMP/QGram-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QGram-unsigned-ipa
          path: ${{ runner.temp }}/QGram-unsigned.ipa
          if-no-found: error
